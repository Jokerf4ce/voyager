<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voyager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="top">
    <button id="btn-menu" class="icon-btn" title="Toggle menu">☰</button>
    <div class="logo">VOYAGER</div>
    <div id="top-res"></div>
    <div class="spacer"></div>
    <div id="cycle">CYCLE 1</div>
    <button id="btn-music" class="btn icon" title="Music on/off">♪</button>
    <button id="btn-auto" class="btn" title="Cycles advance on their own">▶ AUTO</button>
    <button id="btn-end" class="btn gold" title="Space / Enter">END CYCLE ▸</button>
  </header>
  <div id="body">
    <nav id="nav"></nav>
    <div id="center">
      <main id="main"></main>
      <div id="ticker"></div>
    </div>
  </div>
  <div id="modal"></div>
  <div id="version" title="Voyager build"></div>

  <script src="js/version.js"></script>
  <script src="js/data.js"></script>
  <script src="js/util.js"></script>
  <script src="js/planets.js"></script>
  <script src="js/state.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/galaxy.js"></script>
  <script src="js/economy.js"></script>
  <script src="js/research.js"></script>
  <script src="js/fleets.js"></script>
  <script src="js/explore.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/gacha.js"></script>
  <script src="js/tracks.js"></script>
  <script src="js/music.js"></script>
  <script src="js/voicelines.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/map.js"></script>
  <script src="js/sysmap.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
